[package]
name = "mermaid-cli"
version = "0.2.1-alpha"
edition = "2021"
authors = ["Hao430"]
description = "High-performance Mermaid CLI tool written in Rust"
license = "MIT"
repository = "https://github.com/yourusername/mermaid-cli"

[package.metadata.wasm]
wasm-opt = false

[dependencies]
resvg = { version = "0.42", optional = true }
usvg = { version = "0.42", optional = true }
tiny-skia = { version = "0.11", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
# printpdf = { version = "0.9", optional = true } # PDF output - future feature

[features]
default = ["json"]
json = ["serde", "serde_json"]
png = ["resvg", "usvg", "tiny-skia"]
wasm = ["wasm-bindgen"]

[lib]
crate-type = ["lib", "cdylib"]

[dev-dependencies]
# tempfile = "3.8"

[[bin]]
name = "mermaid-cli"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
